<svg width="400" height="250" viewBox="0 0 400 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Large Multiplication Symbol -->
  <g filter="url(#shadow)">
    <path d="M160 80L240 160M240 80L160 160" stroke="url(#grad1)" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- Floating Numbers (no text phrases) -->
  <text x="70" y="70" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#ec4899" transform="rotate(-15 70 70)" filter="url(#shadow)">2</text>
  <text x="320" y="80" font-family="Arial, sans-serif" font-weight="900" font-size="48" fill="#10b981" transform="rotate(20 320 80)" filter="url(#shadow)">5</text>
  <text x="80" y="190" font-family="Arial, sans-serif" font-weight="900" font-size="46" fill="#f59e0b" transform="rotate(10 80 190)" filter="url(#shadow)">8</text>
  <text x="310" y="180" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="#3b82f6" transform="rotate(-10 310 180)" filter="url(#shadow)">3</text>
  
  <text x="200" y="40" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#8b5cf6" transform="rotate(5 200 40)" opacity="0.7" filter="url(#shadow)">9</text>
  <text x="200" y="210" font-family="Arial, sans-serif" font-weight="900" font-size="36" fill="#ec4899" transform="rotate(-5 200 210)" opacity="0.7" filter="url(#shadow)">7</text>
  <text x="120" y="120" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="white" opacity="0.4" filter="url(#shadow)">x</text>
  <text x="280" y="120" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="white" opacity="0.4" filter="url(#shadow)">=</text>
</svg>
